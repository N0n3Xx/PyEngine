[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyengine"
version = "0.1.0"
description = "Barebones Python factory game engine scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "glfw>=2.8",
    "rendercanvas[glfw]>=2.0",
    "wgpu>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory_engine = ["shaders/*.wgsl"]
